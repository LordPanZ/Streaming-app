name: Comprobaciones

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verificar:
    name: Tipos, estilo, pruebas y compilación
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # NFR-002: la instalación y las pruebas no dependen de las APIs de
      # terceros ni de ninguna clave.
      - name: Instalar dependencias
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Comprobar estilo
        run: npm run lint

      - name: Ejecutar pruebas
        run: npm test

      - name: Compilar
        run: npm run build

      # Carga la interfaz compilada sin precargador, como en Android, y
      # comprueba que se monta y sobrevive. Una pantalla negra en el móvil
      # pasaba todas las pruebas unitarias antes de existir esto.
      - name: Prueba de humo del renderizado
        run: npm run smoke

name: Comprobaciones

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verificar:
    name: Tipos, estilo, pruebas y compilación
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # NFR-002: la instalación y las pruebas no dependen de las APIs de
      # terceros ni de ninguna clave.
      #
      # Aquí NO se salta la descarga del binario de Electron. Se saltaba, y la
      # prueba de humo del final llevaba tres versiones fallando por eso: el
      # paquete de npm estaba, pero sin binario que ejecutar. El flujo del
      # agente semanal sí puede saltársela, porque corre en Node y no abre
      # ninguna ventana.
      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Comprobar estilo
        run: npm run lint

      - name: Ejecutar pruebas
        run: npm test

      - name: Compilar
        run: npm run build

      # Carga la interfaz compilada sin precargador, como en Android, y
      # comprueba que se monta y sobrevive. Una pantalla negra en el móvil
      # pasaba todas las pruebas unitarias antes de existir esto.
      - name: Prueba de humo del renderizado
        run: npm run smoke

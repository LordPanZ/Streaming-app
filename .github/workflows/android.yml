name: APK de Android

# FR-043: construye el APK instalable. Los ejecutores de Ubuntu ya traen el SDK
# de Android, así que no hay que instalarlo.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # Invocable desde el flujo de publicación, para no duplicar estos pasos.
  workflow_call:

jobs:
  apk:
    name: Construir el APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Electron no entra en el APK, pero la prueba de humo del renderizado lo
      # usa para cargar la interfaz compilada como lo hará el móvil. Saltarse su
      # descarga dejaba ese paso sin poder ejecutarse.
      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar antes de construir
        run: npm run typecheck && npm test

      # Imprescindible aquí: es la interfaz que acabará dentro del APK.
      - name: Prueba de humo del renderizado
        run: npm run build:renderer && npm run smoke

      - name: Compilar la interfaz y sincronizar el contenedor
        run: npm run build:android

      - name: Construir el APK de depuración
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # Firmado de depuración: sirve para instalarlo en un móvil propio, no para
      # publicarlo en una tienda. La firma de publicación es la tarea T093.
      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: estrenos-es-android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

name: Publicar instaladores

# FR-041: al etiquetar una versión se construyen los instaladores en las tres
# plataformas y se adjuntan a la publicación de GitHub.

on:
  push:
    tags: ['v*']
  # También a mano, para poder generar los instaladores sin etiquetar una
  # versión: útil cuando solo se quiere probar el resultado.
  workflow_dispatch:

jobs:
  empaquetar:
    name: Empaquetar en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar antes de empaquetar
        run: npm run check

      - name: Construir el instalador
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar los artefactos
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn

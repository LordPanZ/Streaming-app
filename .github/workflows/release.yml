name: Publicar instaladores

# FR-041: al etiquetar una versión se construyen los instaladores en las tres
# plataformas y se adjuntan a la publicación de GitHub.

on:
  push:
    tags: ['v*']
  # También a mano, para poder generar los instaladores sin etiquetar una
  # versión: útil cuando solo se quiere probar el resultado.
  workflow_dispatch:

# Necesario para crear la publicación y adjuntarle los archivos.
permissions:
  contents: write

jobs:
  empaquetar:
    name: Empaquetar en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar antes de empaquetar
        run: npm run check

      - name: Construir el instalador
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar los artefactos
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn

  apk:
    name: APK de Android
    # Se reutiliza el flujo del APK en lugar de repetir aquí sus pasos.
    uses: ./.github/workflows/android.yml

  publicar:
    name: Publicar la versión
    needs: [empaquetar, apk]
    runs-on: ubuntu-latest

    steps:
      - name: Recoger todo lo construido
        uses: actions/download-artifact@v4
        with:
          path: artefactos

      - name: Aplanar los archivos
        run: |
          mkdir -p publicar
          find artefactos -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \
            -o -name '*.deb' -o -name '*.apk' \) -exec cp {} publicar/ \;
          ls -lh publicar

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          # Etiqueta fija: cada ejecución sustituye los archivos de esta versión
          # en lugar de acumular publicaciones sueltas.
          tag_name: v1.0.0
          name: Estrenos ES 1.0.0
          body: |
            Primera versión. Recopilación semanal de estrenos de doce plataformas
            de streaming en España, con notas de IMDb, Rotten Tomatoes, Metacritic
            y TMDB, géneros, tráiler en castellano verificado, marcado de vistas y
            valoración por siete criterios ponderados.

            | Sistema | Archivo |
            |---|---|
            | Windows | `Estrenos-ES-Setup-1.0.0.exe` |
            | macOS | `Estrenos-ES-1.0.0-<arquitectura>.dmg` |
            | Linux | `Estrenos-ES-1.0.0.AppImage` o `.deb` |
            | Android | `app-debug.apk` |

            Los archivos de escritorio no van firmados y el APK lleva firma de
            depuración: valen para instalarlos en equipos propios, no para
            distribuirlos en una tienda.
          files: publicar/*
          draft: false
          prerelease: false
